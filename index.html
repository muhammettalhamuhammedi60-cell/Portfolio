<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Kişisel Kart</title>
    <style>
        *{
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Segoe UI',Tahoma ,Geneva,Verdana,sans-serif;
            }
            body {
                background: linear-gradient(135deg,#667eea 0%,#764ba2 100%);
                min-height: 100vh;
                display: flex;
                justify-content: center;
                align-items: center; 
            }
            .card{
                background-color: #ffffff;
                padding: 40px;
                border-radius: 16px;
                box-shadow: 0 10px 25px rgba(0, 0, 0, 0.2);
                text-align: center;
                max-width: 350px;
                width: 90%;
            }
            .profile-img{
                width: 100px;
                height: 100px;
                border-radius: 50%;
                background-image: url("profil.jpeg");
                background-size: cover;
                background-position: center;
                margin: 0 auto 20px;
                object-fit: cover;
            }
            h1{
                font-size: 1.5rem;
                color: #333;
                margin-bottom: 8px;
            }
            p.subtitle {
                color: #666;
                font-size: 0.9rem;
                margin-bottom: 20px;


            }
            .skills {
                display: flex;
                gap: 8px;
                justify-content: center;
                margin-bottom: 25px;
            }
            .tag{
                background-color: #eef2ff;
                color: #4f46e5;
                padding: 4px 12px;
                border-radius: 12px;
                font-size: 0.8rem;
                font-weight: 600;
            }
            .btn{
                display: block;
                background-color: #4f46e5;
                color: white;
                text-decoration: none;
                padding: 10px;
                border-radius: 8px;
                font-weight: 500;
                transition: background-color 0.3s ease;

            }
            .btn:hover{
                background-color: #3730a3;
            }
            .logo-btn{
                display: inline-flex;
                align-items: center;
                justify-content: center;
                gap: 8px;
                padding: 6px ;
                background-color: #ffffff;
                color: white;
                border: none;
                border-radius: 6px;
                cursor: pointer;
                font-size: 14px;

            }
            .btn-logo{
                width: 30px;
                height: 30px;
                object-fit: contain;
            }
            .instagram{
                text-align: center;
                margin-top: 15px;
            }
            
 
            

    </style>
</head>
<body>
    <div class="card">
        <div class = "profile-img"></div>
        <h1>Talha Muhammedi</h1>
        <p class ="subtitle">Öğrenci</p>
        <div class="Skills">
            <span class="tag">İşletme</span>
            <span class="tag">YBS</span>
        </div>

        <div class="instagram">
            <a href="https://www.instagram.com/tlhaersoz/" target="_blank">
                <button class="logo-btn">
                    <img src="images.jpg" alt="Logo" class="btn-logo">
                </button>
            </a>
            <a href="https://www.linkedin.com/in/muhammet-talha-muhammedi-5bb2a1381/" target="_blank">
                <button class="logo-btn">
                    <img src="thly.png" alt="Logo class="btn-logo">
                <button>
            <a>
        </div>
       
       

        

</body>
</html>
